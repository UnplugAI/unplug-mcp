[project]
name = "unplug-mcp"
version = "0.1.1"
description = "MCP server for Unplug — LLM defense layer for Claude Code, Cursor, and more"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Chirag Gupta" }]
keywords = ["llm", "mcp", "prompt-injection", "ai-safety", "guardrails", "cursor", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "unplug-ai>=0.3.1",
    "mcp>=1.0",
]

[project.urls]
Homepage = "https://unplug-ai.org"
Repository = "https://github.com/UnplugAI/unplug-mcp"
Issues = "https://github.com/UnplugAI/unplug-mcp/issues"
Documentation = "https://github.com/UnplugAI/unplug-mcp#readme"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "httpx>=0.27",
    "unplug-ai[ml]",
]
agent = [
    "httpx>=0.27",
    "unplug-ai[ml]",
]
ml = [
    "unplug-ai[ml]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unplug_mcp"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".uv-cache",
    "reports",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    ".venv",
    ".github",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[project.scripts]
unplug-mcp = "unplug_mcp.server:main"
unplug-test-agent = "unplug_mcp.test_agent.cli:main"

[tool.uv.sources]
unplug-ai = { path = "../../jakarta/sdk", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
