[project]
name = "unplug-mcp"
version = "0.1.0"
description = "MCP server for Unplug — LLM defense layer for Claude Code, Cursor, and more"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Chirag Gupta" }]

dependencies = [
    "unplug-ai>=0.2.1",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "httpx>=0.27",
    "unplug-ai[ml]",
]
agent = [
    "httpx>=0.27",
    "unplug-ai[ml]",
]
ml = [
    "unplug-ai[ml]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unplug_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[project.scripts]
unplug-mcp = "unplug_mcp.server:main"
unplug-test-agent = "unplug_mcp.test_agent.cli:main"

[tool.uv.sources]
unplug-ai = { path = "../../jakarta/sdk", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
