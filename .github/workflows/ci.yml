name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          uv-version: "0.6.14"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Point unplug SDK at feature branch
        run: |
          sed -i 's|unplug = { path = "../../jakarta/sdk", editable = true }|unplug = { git = "https://github.com/chiruu12/Unplug.git", branch = "feature/release-0.3-ci", subdirectory = "sdk" }|' pyproject.toml

      - name: Install
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q
