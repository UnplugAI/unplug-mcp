name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.6.14"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install (PyPI SDK, ignore local path sources)
        run: uv sync --extra dev --no-sources

      - name: Ruff
        run: |
          uv run --no-sources ruff check .
          uv run --no-sources ruff format --check .

      - name: Tests
        run: uv run --no-sources pytest -q
