name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          uv-version: "0.6.14"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (PyPI SDK, ignore local path sources)
        run: uv sync --extra dev --no-sources

      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q
