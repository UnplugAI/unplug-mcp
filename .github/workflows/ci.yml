name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout Unplug SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: chiruu12/Unplug
          ref: feature/release-0.3-ci
          path: Unplug

      - uses: astral-sh/setup-uv@94c66329fd4d1228f3b469afd1ac2f3ac78e251 # v5.4.2
        with:
          enable-cache: true
          uv-version: "0.6.14"

      - uses: actions/setup-python@a26af69bb79f8c25af5445bcac09723621c4f68 # v5.6.0
        with:
          python-version: "3.12"

      - name: Patch SDK path
        run: sed -i 's|path = "../../jakarta/sdk"|path = "../Unplug/sdk"|' pyproject.toml

      - name: Install
        run: uv sync --dev

      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q
