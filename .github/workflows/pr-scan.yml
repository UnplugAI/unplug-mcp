name: PR agent scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.6.14"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install unplug-ai (dev SDK until unplug-scan-pr ships on PyPI)
        run: |
          uv pip install --system \
            "unplug-ai @ git+https://github.com/UnplugAI/Unplug.git@dev#subdirectory=sdk"

      - name: Scan changed agent files
        run: unplug-scan-pr --base-ref main
