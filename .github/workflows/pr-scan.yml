name: PR agent scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: UnplugAI/unplug-scan-action@v1
        with:
          base-ref: main
          unplug-version: ">=0.5.2,<0.7"
